name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Kotlin compiler + Maven jars
        uses: actions/cache@v4
        with:
          path: |
            ~/kotlinc
            /tmp/apex-libs
          key: kotlinc-2.3.21-libs-v1

      - name: Install Kotlin compiler
        run: |
          if [ ! -x "$HOME/kotlinc/bin/kotlinc" ]; then
            curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip -o /tmp/kotlin.zip
            unzip -q /tmp/kotlin.zip -d $HOME/
          fi
          echo "$HOME/kotlinc/bin" >> $GITHUB_PATH

      - name: Download Maven dependencies
        run: |
          mkdir -p /tmp/apex-libs
          NEED_DL=0
          for jar in kotlin-stdlib-2.3.21.jar \
                     kotlinx-coroutines-core-jvm-1.10.2.jar \
                     kotlinx-serialization-json-jvm-1.9.0.jar \
                     kotlinx-serialization-core-jvm-1.9.0.jar \
                     okhttp-4.12.0.jar \
                     okio-jvm-3.6.0.jar; do
            [ -f "/tmp/apex-libs/$jar" ] || NEED_DL=1
          done
          if [ "$NEED_DL" -eq 0 ]; then
            echo "✅ All Maven jars restored from cache"
            exit 0
          fi
          KOTLIN_VER=2.3.21
          COROUTINES_VER=1.10.2
          SERIALIZATION_VER=1.9.0
          OKHTTP_VER=4.12.0
          for dep in \
            "org/jetbrains/kotlin/kotlin-stdlib/$KOTLIN_VER/kotlin-stdlib-$KOTLIN_VER.jar" \
            "org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/$COROUTINES_VER/kotlinx-coroutines-core-jvm-$COROUTINES_VER.jar" \
            "org/jetbrains/kotlinx/kotlinx-serialization-json-jvm/$SERIALIZATION_VER/kotlinx-serialization-json-jvm-$SERIALIZATION_VER.jar" \
            "org/jetbrains/kotlinx/kotlinx-serialization-core-jvm/$SERIALIZATION_VER/kotlinx-serialization-core-jvm-$SERIALIZATION_VER.jar" \
            "com/squareup/okhttp3/okhttp/$OKHTTP_VER/okhttp-$OKHTTP_VER.jar" \
            "com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar"; do
            fname=$(basename "$dep")
            curl -sL "https://repo1.maven.org/maven2/$dep" -o "/tmp/apex-libs/$fname"
          done

      - name: Compile core:logging
        run: |
          SER_PLUGIN=$HOME/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar
          CLASSPATH=$(find /tmp/apex-libs -name "*.jar" | tr '\n' ':')
          kotlinc -Xplugin=$SER_PLUGIN -cp "$CLASSPATH" -d /tmp/build/logging \
            $(find core/logging/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Compile core:llm-adapter
        run: |
          CLASSPATH="$(find /tmp/apex-libs -name '*.jar' | tr '\n' ':')/tmp/build/logging"
          SER_PLUGIN=$HOME/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar
          kotlinc -Xplugin=$SER_PLUGIN -cp "$CLASSPATH" -d /tmp/build/llm-adapter \
            $(find core/llm-adapter/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Compile core:tool-registry
        run: |
          SER_PLUGIN=$HOME/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar
          CLASSPATH="$(find /tmp/apex-libs -name '*.jar' | tr '\n' ':')/tmp/build/llm-adapter:/tmp/build/logging"
          kotlinc -Xplugin=$SER_PLUGIN -cp "$CLASSPATH" -d /tmp/build/tool-registry \
            $(find core/tool-registry/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Compile core:agent-engine
        run: |
          SER_PLUGIN=$HOME/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar
          CLASSPATH="$(find /tmp/apex-libs -name '*.jar' | tr '\n' ':')/tmp/build/llm-adapter:/tmp/build/tool-registry:/tmp/build/logging"
          kotlinc -Xplugin=$SER_PLUGIN -cp "$CLASSPATH" -d /tmp/build/agent-engine \
            $(find core/agent-engine/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Check tool ID uniqueness
        run: |
          # 语义 id 的唯一性只对字面字符串声明有判定意义：常量引用解析出常量值后再查重。
          extract_ids() {
            grep -rn "override val id = " "$1" | while IFS=: read -r file line rest; do
              ref=$(echo "$rest" | sed -n 's/.*override val id = \([A-Z_][A-Z0-9_]*\)\s*$/\1/p' | tr -d ' ')
              if [ -n "$ref" ]; then
                val=$(grep -h "const val $ref = " "$file" | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
                echo "CONST_REF:${ref}=${val}"
              else
                echo "$rest" | sed -n 's/.*override val id = *"\(.*\)".*/LITERAL:\1/p'
              fi
            done
          }
          IDS=$( { extract_ids core/tool-registry/src/main/kotlin/; extract_ids platform/terminal/src/main/kotlin/; extract_ids app/src/main/kotlin/; } | sort | uniq -d)
          if [ -n "$IDS" ]; then
            echo "❌ Duplicate tool IDs found:"
            echo "$IDS"
            exit 1
          fi
          TOTAL=$(grep -rh "override val id = " core/tool-registry/src/main/kotlin/ platform/terminal/src/main/kotlin/ app/src/main/kotlin/ | wc -l)
          echo "✅ $TOTAL tool id declarations, no semantic duplicates"

      - name: Check duplicate classes
        run: |
          DUPLICATES=$(grep -rh "^class \|^object \|^enum class \|^data class " --include="*.kt" . | sed 's/^[a-z ]*//' | sed 's/[<(].*//' | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "⚠️ Potential duplicate class names (may be in different packages):"
            echo "$DUPLICATES"
          else
            echo "✅ No duplicate class names"
          fi

      - name: Check bracket balance (lexer-aware)
        run: |
          FAIL=0
          for f in $(find . -name "*.kt" -not -path "./.git/*" -not -path "./build/*" -not -path "*/build/*"); do
            RESULT=$(python3 scripts/kotlin_balance.py "$f" 2>&1) || { echo "$RESULT"; FAIL=1; }
          done
          if [ $FAIL -eq 0 ]; then
            echo "✅ All .kt files have balanced parens () and braces {} (comments/strings stripped)"
          else
            exit 1
          fi

  app-compile:
    name: App Module Compile (Android SDK + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 浏览器库 composite build 检出（actions/checkout 禁止越出 workspace，
      # 用嵌套路径 apex-kit-browser —— settings.gradle.kts 的嵌套兜底分支命中；
      # 本地开发仍是兄弟目录 ../apex-kit-browser，两种布局等价）
      - name: Read apex-kit-browser pin
        id: bkitpin
        # 锁定文件 gradle/browser-kit.lock 由 sync-browser-kit 工作流自动维护。
        # 缺锁回退 main（防御旧分支/分叉构建）—— CI 只验证不发货，回退可接受。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          if [ -z "$PIN" ]; then
            echo "::warning::gradle/browser-kit.lock 缺失 —— 防御性回退 browser-kit main HEAD（仅限 CI 验证；发布流水线 release.yml 缺锁即硬失败）"
          fi
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-browser (browser-kit composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-browser
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: apex-kit-browser

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK_VER="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VER"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "✅ NDK $NDK_VER 已就绪（缓存命中）"
          else
            rm -rf "$NDK_DIR"
            NDK_OK=0
            for ATTEMPT in 1 2; do
              if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                  --install "ndk;$NDK_VER" >/dev/null 2>&1 && \
                 [ -f "$NDK_DIR/source.properties" ]; then
                NDK_OK=1; break
              fi
              rm -rf "$NDK_DIR"
              sleep 5
            done
            if [ "$NDK_OK" != "1" ]; then
              echo "⚠️ sdkmanager 安装 NDK 失败 —— dl.google.com 官方 zip 直下兜底"
              mkdir -p "$ANDROID_HOME/ndk"
              curl -sL "https://dl.google.com/android/repository/android-ndk-r27b-linux.zip" -o /tmp/ndk.zip
              unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
              mv "/tmp/ndk-extract/android-ndk-r27b" "$NDK_DIR"
            fi
          fi
          # SDK 平台/构建工具完整性校验（半截安装会让 AGP 报晦涩错误）
          for COMP in "platforms;android-36" "build-tools;36.0.0"; do
            if ! yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -q "$(echo $COMP | cut -d';' -f2)"; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$COMP" >/dev/null 2>&1 || true
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          set -o pipefail
          if ./gradlew :app:dependencies \
              --configuration debugCompileClasspath \
              --no-daemon -Pkotlin.incremental=false > /tmp/deps.log 2>&1; then
            echo "✅ dependencies resolved"
          else
            echo "⚠️ dependency resolution failed once — retrying (JitPack flakiness)"
            ./gradlew :app:dependencies \
              --configuration debugCompileClasspath \
              --no-daemon -Pkotlin.incremental=false > /tmp/deps.log 2>&1 || {
                echo "❌ resolution failed after retry"; cat /tmp/deps.log; exit 1; }
          fi

      - name: Compile app (debug Kotlin)
        run: |
          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace

  unit-tests:
    name: Unit Tests (JVM modules)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read apex-kit-browser pin
        id: bkitpin
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-browser (browser-kit composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-browser
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: apex-kit-browser

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK_VER="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VER"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            rm -rf "$NDK_DIR"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --install "ndk;$NDK_VER" >/dev/null 2>&1 || true
          fi
          for COMP in "platforms;android-36" "build-tools;36.0.0"; do
            if ! yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -q "$(echo $COMP | cut -d';' -f2)"; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$COMP" >/dev/null 2>&1 || true
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14

      - name: Compile app + run all module unit tests (single invocation)
        run: |
          ./gradlew \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :platform:terminal:testDebugUnitTest \
            :terminal-emulator:testDebugUnitTest \
            :terminal-view:testDebugUnitTest \
            :platform:terminal:compileDebugAndroidTestKotlin \
            :core:agent-engine:test \
            :core:tool-registry:test \
            :platform:privilege:testDebugUnitTest \
            :plugins:plugin-workflow:testDebugUnitTest \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace \
            --continue \
            --parallel \
            2>&1 | tee build.log
        continue-on-error: true

      - name: Analyze build result
        run: |
          echo "=== Build Status ==="
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "✅ BUILD SUCCESSFUL — app 编译 + 模块单测单次通过"
            exit 0
          fi

          echo "❌ BUILD FAILED — analyzing errors..."

          FAILED_TASKS=$(grep -E "^> Task .* FAILED$" build.log || true)
          if [ -n "$FAILED_TASKS" ]; then
            echo "❌ 失败任务清单："
            echo "$FAILED_TASKS"
            echo ""
            echo "失败用例明细（前 30 条）："
            grep -vE "^> Task" build.log | grep -E "FAILED$" | head -30 || true
            grep -E "[0-9]+ tests completed, [0-9]+ failed" build.log || true
            exit 1
          fi

          echo "❌ 编译/KSP 失败（无任务级 FAILED 行）："
          grep -E "^e: |error: " build.log | head -40 || true
          exit 1

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Read apex-kit-browser pin
        id: bkitpin
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-kit-browser (browser-kit composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: Ultra-Guru/apex-kit-browser
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: apex-kit-browser

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK_VER="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VER"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            rm -rf "$NDK_DIR"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --install "ndk;$NDK_VER" >/dev/null 2>&1 || true
          fi
          for COMP in "platforms;android-36" "build-tools;36.0.0"; do
            if ! yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -q "$(echo $COMP | cut -d';' -f2)"; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$COMP" >/dev/null 2>&1 || true
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          set -o pipefail
          if ./gradlew :app:dependencies \
              --configuration debugCompileClasspath \
              --no-daemon -Pkotlin.incremental=false > /tmp/deps.log 2>&1; then
            echo "✅ dependencies resolved"
          else
            echo "⚠️ dependency resolution failed once — retrying (JitPack flakiness)"
            ./gradlew :app:dependencies \
              --configuration debugCompileClasspath \
              --no-daemon -Pkotlin.incremental=false > /tmp/deps.log 2>&1 || {
                echo "❌ resolution failed after retry"; cat /tmp/deps.log; exit 1; }
          fi

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            -Pkotlin.incremental=false \
            -PapexAbi=arm64-v8a \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: APK size report
        if: always()
        run: |
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            APK_SIZE=$(du -h app/build/outputs/apk/debug/*.apk | cut -f1)
            echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
            echo "✅ Debug APK built: $APK_SIZE"
          else
            echo "⚠️ No APK built"
          fi
